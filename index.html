<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ни свет — Табель</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f2;
      color: #171717;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    h1 {
      font-size: 26px;
      margin: 0 0 5px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 16px;
    }

    .venue {
      color: #666;
      margin-bottom: 20px;
    }

    .employee {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .status {
      color: #666;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 16px;
      font-size: 17px;
      cursor: pointer;
      background: #111;
      color: #fff;
      margin-top: 10px;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    .secondary {
      background: #e9e9e7;
      color: #111;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 11px;
      font-size: 16px;
      margin-bottom: 10px;
      background: white;
    }

    label {
      display: block;
      font-size: 14px;
      color: #666;
      margin: 12px 0 6px;
    }

    .message {
      padding: 13px;
      border-radius: 11px;
      background: #f0f0ee;
      margin-top: 15px;
      line-height: 1.4;
    }

    .success {
      background: #e7f5e9;
      color: #23632d;
    }

    .error {
      background: #fae8e8;
      color: #8b2525;
    }

    .hidden {
      display: none !important;
    }

    .link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #555;
      text-decoration: underline;
      cursor: pointer;
    }

    .distance {
      font-size: 14px;
      color: #666;
      margin-top: 8px;
    }

    .loading {
      color: #777;
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>Ни свет — Табель</h1>
    <div class="venue" id="venueName">Загрузка...</div>

    <div id="loading" class="loading">
      Подключение...
    </div>

    <div id="work" class="hidden">

      <div class="employee" id="employeeName"></div>
      <div class="status" id="shiftStatus">
        Проверяем смену...
      </div>

      <button id="shiftButton" onclick="toggleShift()">
        Начать смену
      </button>

      <div id="distance" class="distance"></div>

      <div id="workMessage"></div>

      <span class="link" onclick="showRegistration()">
        Не ваш сотрудник? Зарегистрироваться
      </span>

    </div>

    <div id="notRegistered" class="hidden">

      <h2>Регистрация</h2>

      <div style="color:#666;margin-bottom:15px">
        Оставьте заявку. После подтверждения администратора
        вы получите доступ к табелю.
      </div>

      <label>Имя</label>
      <input id="regName" placeholder="Например, Иван">

      <label>Телефон</label>
      <input id="regPhone" placeholder="+7 900 000-00-00">

      <label>Должность</label>
      <input id="regPosition" placeholder="Бармен">

      <button onclick="registerEmployee()">
        Отправить заявку
      </button>

      <span class="link" onclick="showWork()">
        Назад
      </span>

      <div id="registrationMessage"></div>

    </div>

  </div>

</div>


<script>

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbyo3mVjn7qTL7NkeOIW68OAMHaoJvDlt3UgyZsSdUzwgxmtIweMF0GCT_SCHRiZIDiaHg/exec";


const params = new URLSearchParams(
  window.location.search
);

const venueSlug =
  params.get("venue") || "pokrovka";


let venue = null;
let employee = null;
let currentShift = false;


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  init
);


async function init() {

  try {

    await loadVenue();

    const token =
      localStorage.getItem("ns_token");

    if (!token) {
      showNotRegistered();
      return;
    }

    await loadEmployee(token);

  } catch (error) {

    showMessage(
      "workMessage",
      error.message || "Ошибка подключения",
      true
    );

  } finally {

    document
      .getElementById("loading")
      .classList.add("hidden");
  }
}


/* =========================
   VENUE
========================= */

async function loadVenue() {

  const response =
    await fetch(
      BACKEND_URL +
      "?action=venues"
    );

  const data =
    await response.json();

  if (!data.ok) {
    throw new Error(
      data.error || "Не удалось загрузить заведения"
    );
  }

  venue =
    data.venues.find(
      v => v.slug === venueSlug
    );

  if (!venue) {
    throw new Error(
      "Заведение не найдено"
    );
  }

  document.getElementById(
    "venueName"
  ).textContent =
    venue.name;
}


/* =========================
   EMPLOYEE
========================= */

async function loadEmployee(token) {

  const response =
    await fetch(
      BACKEND_URL +
      "?action=me&token=" +
      encodeURIComponent(token)
    );

  const data =
    await response.json();

  if (!data.ok) {

    localStorage.removeItem(
      "ns_token"
    );

    showNotRegistered();

    return;
  }

  employee =
    data.employee;

  document.getElementById(
    "employeeName"
  ).textContent =
    employee.name;

  document
    .getElementById("work")
    .classList.remove("hidden");

  document
    .getElementById("notRegistered")
    .classList.add("hidden");

  document.getElementById(
    "shiftStatus"
  ).textContent =
    "Готов к работе";

  document.getElementById(
    "shiftButton"
  ).textContent =
    "Начать смену";
}


/* =========================
   SHIFT
========================= */

async function toggleShift() {

  const token =
    localStorage.getItem("ns_token");

  if (!token) {
    showNotRegistered();
    return;
  }

  const button =
    document.getElementById(
      "shiftButton"
    );

  button.disabled = true;

  button.textContent =
    "Определяем местоположение...";

  clearMessage("workMessage");

  try {

    const position =
      await getLocation();

    const lat =
      position.coords.latitude;

    const lon =
      position.coords.longitude;

    document.getElementById(
      "distance"
    ).textContent =
      "Проверяем расстояние...";

    const action =
      currentShift
        ? "end_shift"
        : "start_shift";

    const url =
      BACKEND_URL +
      "?action=" +
      action +
      "&token=" +
      encodeURIComponent(token) +
      "&venue=" +
      encodeURIComponent(venueSlug) +
      "&lat=" +
      encodeURIComponent(lat) +
      "&lon=" +
      encodeURIComponent(lon);

    const response =
      await fetch(url);

    const data =
      await response.json();

    if (!data.ok) {

      if (data.distance_m !== undefined) {

        document.getElementById(
          "distance"
        ).textContent =
          "Расстояние: " +
          data.distance_m +
          " м. Допустимо: " +
          data.radius_m +
          " м.";

      }

      throw new Error(
        data.error || "Не удалось выполнить действие"
      );
    }

    if (data.distance_m !== undefined) {

      document.getElementById(
        "distance"
      ).textContent =
        "Расстояние: " +
        data.distance_m +
        " м";
    }

    if (action === "start_shift") {

      currentShift = true;

      document.getElementById(
        "shiftStatus"
      ).textContent =
        "Смена идёт";

      button.textContent =
        "Закончить смену";

      showMessage(
        "workMessage",
        "Смена начата",
        false
      );

    } else {

      currentShift = false;

      document.getElementById(
        "shiftStatus"
      ).textContent =
        "Смена завершена";

      button.textContent =
        "Начать смену";

      showMessage(
        "workMessage",
        "Смена завершена",
        false
      );
    }

  } catch (error) {

    showMessage(
      "workMessage",
      error.message ||
      "Не удалось получить геолокацию",
      true
    );

    button.textContent =
      currentShift
        ? "Закончить смену"
        : "Начать смену";

  } finally {

    button.disabled = false;
  }
}


/* =========================
   GEO
========================= */

function getLocation() {

  return new Promise(
    function(resolve, reject) {

      if (!navigator.geolocation) {

        reject(
          new Error(
            "Браузер не поддерживает геолокацию"
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(
        resolve,
        function(error) {

          let message =
            "Не удалось получить геолокацию";

          if (error.code === 1) {
            message =
              "Разреши доступ к геолокации в браузере";
          }

          if (error.code === 2) {
            message =
              "Местоположение сейчас недоступно";
          }

          if (error.code === 3) {
            message =
              "Не удалось определить местоположение вовремя";
          }

          reject(
            new Error(message)
          );
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );

    }
  );
}


/* =========================
   REGISTRATION
========================= */

function showRegistration() {

  document
    .getElementById("work")
    .classList.add("hidden");

  document
    .getElementById("notRegistered")
    .classList.remove("hidden");

  clearMessage(
    "registrationMessage"
  );
}


function showWork() {

  document
    .getElementById("notRegistered")
    .classList.add("hidden");

  if (employee) {

    document
      .getElementById("work")
      .classList.remove("hidden");

  } else {

    showNotRegistered();
  }
}


function showNotRegistered() {

  document
    .getElementById("work")
    .classList.add("hidden");

  document
    .getElementById("notRegistered")
    .classList.remove("hidden");
}


async function registerEmployee() {

  const name =
    document
      .getElementById("regName")
      .value
      .trim();

  const phone =
    document
      .getElementById("regPhone")
      .value
      .trim();

  const position =
    document
      .getElementById("regPosition")
      .value
      .trim();

  if (!name || !phone || !position) {

    showMessage(
      "registrationMessage",
      "Заполни все поля",
      true
    );

    return;
  }

  const button =
    document.querySelector(
      "#notRegistered button"
    );

  button.disabled = true;

  button.textContent =
    "Отправляем...";

  try {

    const url =
      BACKEND_URL +
      "?action=register" +
      "&name=" +
      encodeURIComponent(name) +
      "&phone=" +
      encodeURIComponent(phone) +
      "&position=" +
      encodeURIComponent(position) +
      "&venue=" +
      encodeURIComponent(venueSlug);

    const response =
      await fetch(url);

    const data =
      await response.json();

    if (!data.ok) {
      throw new Error(
        data.error ||
        "Не удалось отправить заявку"
      );
    }

    showMessage(
      "registrationMessage",
      "Заявка отправлена. Жди подтверждения администратора.",
      false
    );

    document.getElementById(
      "regName"
    ).value = "";

    document.getElementById(
      "regPhone"
    ).value = "";

    document.getElementById(
      "regPosition"
    ).value = "";

  } catch (error) {

    showMessage(
      "registrationMessage",
      error.message ||
      "Ошибка отправки заявки",
      true
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "Отправить заявку";
  }
}


/* =========================
   UI
========================= */

function showMessage(
  elementId,
  text,
  isError
) {

  const element =
    document.getElementById(
      elementId
    );

  element.textContent = text;

  element.className =
    "message " +
    (isError
      ? "error"
      : "success");
}


function clearMessage(elementId) {

  const element =
    document.getElementById(
      elementId
    );

  element.textContent = "";

  element.className =
    "";
}

</script>

</body>
</html>
